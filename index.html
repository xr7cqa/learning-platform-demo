<dialog id="confirmDlg" aria-labelledby="dlgTitle">
  <form method="dialog" class="dlg">
    <h2 id="dlgTitle">مسح التقدّم؟</h2>
    <p>سيُحذف تقدّمك في الدروس ونتائج الألعاب والاختبار من هذا الجهاز، ولا يمكن التراجع عن ذلك.</p>
    <div class="dlg-actions">
      <button value="cancel" class="btn btn-ghost" id="dlgCancel">إلغاء</button>
      <button value="ok" class="btn btn-danger" id="dlgOk">نعم، امسح</button>
    </div>
  </form>
</dialog>
